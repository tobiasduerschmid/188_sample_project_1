verification_plan:
  status: Specified conformance checks; runtime tests and student studies have not been run.
  fixture: Use the synthetic quarter and TEST001/101-105 data in requirements.md section 7.1; never substitute real institutional claims.
  tests:
    T-001:
      owner: CAN-005
      check: Reject every invalid mandatory field/reference/unit/linkage/rule/time/capacity case with record paths; accept explicit optional unknowns and manual-review source text.
      failure_probe: Interrupt staging, fail activation, race two manifest updates, and lose an activation receipt; verify a complete old or new active version and an accurate outcome.
    T-002:
      owner: CAN-006
      check: Exercise no-quarter, first-use failure, retained fallback, exact-version open, >24-hour age, demo labeling, and retry.
      search_probe: Verify trimmed insensitive code/title/instructor search, subject conjunction, same-section instructor/availability matching, deterministic ordering, and clear-filter empty result.
    T-003:
      owner: CAN-003
      check: Run AT-03/AT-08 plus name lengths and duplicates, all per-plan capacities, alias no-op, invalid variable units, unset unit target, independent copy, remove/undo expiration, and fixed-quarter switching.
      assertion: Rejections preserve unrelated values; partial drafts are allowed and incomplete credit is not fabricated.
    T-004:
      owner: CAN-008
      check: Run AT-02/AT-04/AT-07 plus within-course overlap, exams, overnight overlap, endpoint adjacency, nonoverlapping dates, holidays/replacements, DST ambiguity/nonexistence, and foreign device timezone.
      assertion: No personal-personal or canceled/removed-section conflicts; every real pair and every relevant incompleteness reason is represented.
    T-005:
      owner: CAN-002
      check: Delay an earlier assessment until after a later one; force either evaluator to fail; edit while assessment is pending.
      assertion: No stale or partial current report; input survives; all visible check categories have one AssessmentKey.
    T-006:
      owner: CAN-011
      check: Interrupt before/during/after commit, deny storage, exhaust quota, and lose completion notification; reopen and reconcile receipts.
      assertion: Complete acknowledged input/catalog pairs only; no false saved signal, stale replay, database clearing, or lost in-session input.
    T-007:
      owner: CAN-011
      check: Race same-plan saves, duplicate names, the twentieth plan slot, rename versus rename, and delete versus a stale save.
      generation_probe: Queue B then C then B while the first B write is in flight; its receipt must not mark the last B saved or allow queued C to overwrite an acknowledged current state.
      assertion: Atomic decisions, explicit conflict recovery, no resurrection, and download available when separate-copy capacity is exhausted.
    T-008:
      owner: CAN-006
      check: Run AT-07 plus stale preview, invalidated units, removed history/target identities, new equivalent identities with conflicting saved choices/history, and save failure during adoption.
      assertion: Preserve unresolved originals, count effective canonical identities at most once, infer no ambiguous credit, and keep prior durable version complete.
    T-009:
      owner: CAN-013
      check: Export saved, unsaved, pending-assessment, failed-assessment, conflicting, and capacity-blocked drafts; reconstruct every FR-29 input from the text.
      assertion: Correct save/check state, all exceptions/unresolved inputs retained, UTF-8 text, no implicit save/upload, and failed download leaves recovery open.
    T-010:
      owner: CAN-001
      check: Execute exact QR-03/QR-04/QR-08 procedures and FR-16 viewport checks, including error/recovery controls and pre-save disclosures.
      evidence: Record keyboard/screen-reader setup, viewport/zoom, contrast results, participant task times, success counts, and observed errors.
    T-011:
      owner: CAN-009
      check: Run AT-01/AT-05 plus all three-valued all/any combinations, completed-versus-projected corequisites, unsupported branches, retakes, overlapping targets, unknown history/units, removed identities, and count targets with unresolved units.
      assertion: Exact contribution/status order and reasons; partial/full/waitlisted/canceled variants distinguish selected totals from projected credit; categories never clear each other's warnings.
    T-012:
      owner: CAN-002
      check: Run the exact QR-01/QR-02 and FR-24 timing checks at all stated capacity dimensions and reference client/network conditions.
      evidence: Record browser/build/dataset identifiers and action-to-complete samples; errors and incomplete reports fail the sample.
      follow_up: If measurements fail, optimize within existing ownership boundaries and rerun affected scenarios; do not weaken the requirements.
    T-013:
      owner: CAN-012
      check: Use distinct browser profiles, inspect all planning/publication payloads and network activity, and exercise text containing executable markup in labels/catalog content.
      assertion: Private data remains in the originating profile or explicit download; source strings render as text, and catalog publication has no private-state input path.
  acceptance_scenario_mapping:
    AT-01: [COL-001, COL-002, COL-003, T-011]
    AT-02: [COL-002, COL-008, T-004]
    AT-03: [COL-002, T-003]
    AT-04: [COL-001, COL-002, T-002, T-004]
    AT-05: [COL-002, T-011]
    AT-06: [COL-003, COL-004, COL-005, COL-008, T-006, T-007, T-009]
    AT-07: [COL-006, T-004, T-008]
    AT-08: [COL-001, COL-002, COL-005, COL-007, T-001, T-002, T-003, T-007]

residual_risks:
  RSK-001:
    issue: No implementation measurements establish response-time or browser-transaction behavior yet.
    owner: CAN-002
    next_evidence: T-006, T-007, and T-012 on both browser families at the specified workload.
    revisit_trigger: Any stale receipt, partial recovery, or failed performance threshold.
    disposition: Implementation validation obligation; no requirement is relaxed.
  RSK-002:
    issue: Accessible presentation and first-use usability require actual interface and student-study evidence.
    owner: CAN-001
    next_evidence: T-010 with the exact requirements' participant and timing criteria.
    revisit_trigger: Any inaccessible recovery path or fewer than four successful first-time users.
    disposition: Validation remains pending until a UI exists.
  RSK-003:
    issue: Catalog source, hosting/publication permissions, and storage quota behavior depend on the deployment.
    owner: CAN-006
    next_evidence: Select an authorized catalog source and publication adapter; run acceptance/retention/denial probes before institutional use.
    revisit_trigger: Unavailable mandatory catalog facts or a distribution adapter unable to publish atomically.
    disposition: No live integration or extra institutional policy is assumed; synthetic fixture supports implementation meanwhile.
  RSK-004:
    issue: Requirements do not bound meeting-pattern count or academic-expression depth within the stated catalog/plan counts.
    owner: CAN-010
    next_evidence: Performance fixtures must document these dimensions and include representative dense patterns; obtain a requirements decision if arbitrary inputs defeat the stated bound.
    revisit_trigger: A supported input shape makes the required response times unattainable within the reference workload.
    disposition: No new limit is silently added by the design.

change_control:
  authority: Update requirements.md first when externally visible behavior or supported scope changes.
  design_updates: Preserve IDs; update affected ownership, contracts, collaboration stories, realization, and traceability together.
  implementation_conformance: Map each RSP and FR/QR to implementation elements and verification results; unexplained redistribution of policy is a deviation.
  artifact_boundary: This file is the canonical structured design; diagrams or other views must be derived from it rather than independently redefine it.

design_review:
  status: complete
  verdict: Ready to advance to implementation; product acceptance still requires the specified runtime and user validation.
  evidence_scope: Requirements coverage, conceptual scenario walkthroughs, and structured-model validation; not runtime or user-study results.
  stopping_condition: All core responsibilities owned, consequential collaborations reachable, material contradictions repaired, and all requirement/acceptance references covered.
  coverage: {functional_requirements: 29, quality_requirements: 8, acceptance_scenarios: 8, components: 13, responsibilities: 37}
  independent_review:
    requirements_coverage: No material remaining contradictions or added product scope.
    responsibility_design: All hard gates passed after targeted repairs and fresh parsed-model checks.
    quality_score: 96
    rated_weight: 100
    evidence_coverage_score: 92.5
    score_scale: 100
    limitation: Confidence applies to the proposed design and analytical probes, not to an unbuilt implementation.
  gates:
    V1_context: {result: pass, evidence: "context and requirements_baseline distinguish authority, assumptions, and design choices"}
    V2_coverage: {result: pass, evidence: "all 37 FR/QR entries and normative sections map to owners; system_responsibilities.unassigned is empty"}
    V3_coherence: {result: pass, evidence: "components assign each responsibility once and separate session, domain, assessment, and storage authority"}
    V4_dynamics: {result: pass, evidence: "COL-001 through COL-008 reach their required outcomes with explicit alternate paths"}
    V5_reachability: {result: pass, evidence: "every parsed story edge names a declared collaborator and every cited RSP belongs to its receiver"}
    V6_control: {result: pass, evidence: "CTL-001 through CTL-004 and session_state_machines locate sequencing and decision ownership"}
    V7_boundaries: {result: pass, evidence: "neighborhoods, realization.module_rules, and trust_and_failure_policies restrict cross-boundary authority"}
    V8_reliability: {result: pass, evidence: "CTR-001 through CTR-010 and POL-001 through POL-008 define failure, recovery, and resulting state"}
    V9_flexibility: {result: pass, evidence: "HOT-001 through HOT-003 have requirements-backed variation, fixed invariants, and conformance checks"}
    V10_traceability: {result: pass, evidence: "requirement_traceability and acceptance_scenario_mapping contain all required IDs with valid references"}
    V11_handoff: {result: pass, evidence: "realization and verification_plan preserve conceptual ownership and identify remaining implementation evidence"}
  repaired_risks:
    - Current-generation save acknowledgment cannot be inferred from an older equal-content receipt.
    - Pending assessment does not block reconstructable recovery download or permit stale check results.
    - Temporal evaluation receives the full authoritative quarter envelope.
    - Catalog identity changes preserve conflicting source history without inventing completed credit.
    - Publication distinguishes definite failure from uncertain activation and verifies its aftereffect.
    - Name collisions, conflicting tabs, and catalog adoption preserve unrelated student input.
